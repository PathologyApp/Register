<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pathology Register</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>

<header>
  <h1>Pathology Register</h1>
  <button id="loginBtn">Login with Google</button>
  <div id="userInfo"></div>
</header>

<!-- Tabs -->
<div class="tabs">
  <button id="patientsTab">Patients</button>
  <button id="logsTab">Logs</button>
</div>

<main>
  <div id="patientList"></div>
  <div id="logsView" class="hidden"></div>
</main>

<button id="addPatientBtn">＋</button>

<!-- Patient Modal -->
<div id="patientModal" class="modal hidden">
  <div class="modal-content">
    <h2>Add Patient</h2>
    <input id="pName" placeholder="Name"/>
    <input id="pAge" type="number" placeholder="Age"/>
    <select id="pGender">
      <option>Male</option>
      <option>Female</option>
    </select>
    <input id="pDate" type="date">
    <button id="savePatient">Save</button>
  </div>
</div>

<!-- Test Modal -->
<div id="testModal" class="modal hidden">
  <div class="modal-content">
    <h2>Add Test</h2>
    <input id="tName" placeholder="Test Name"/>
    <input id="tDate" type="text" placeholder="Select Date"/>
    <button id="saveTest">Save Test</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script type="module" src="app.js"></script>
</body>
</html>
